  - uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
    python-version: '3.10'

  - name: Install Dependencies
    run: |
      sudo apt-get update
       sudo apt-get install -y \
         autoconf \
        libtool \
      libtool-bin \
      m4 \
      pkg-config \
      python3-pip \
      build-essential \
      git \
      python3-dev \
      ffmpeg \
      libsdl2-dev \
      libsdl2-image-dev \
      libsdl2-mixer-dev \
      libsdl2-ttf-dev \
      libportmidi-dev \
      libswscale-dev \
      libavformat-dev \
      libavcodec-dev \
      zlib1g-dev \
      libffi-dev \
      libssl-dev

    -name: Install Buildozer and Cython
    run: |
      python -m pip install --upgrade pip
      python -m pip install \
       "cython==0.29.33" \
      "virtualenv<21" \
       "buildozer==1.5.0"

  - name: Build APK with Buildozer
   run: |
      rm -rf .buildozer
      yes | buildozer -v android debug
