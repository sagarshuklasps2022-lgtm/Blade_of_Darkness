name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            git \
            libavcodec-dev \
            libavformat-dev \
            libffi-dev \
            libltdl-dev \
            libportmidi-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libsdl2-mixer-dev \
            libsdl2-ttf-dev \
            libssl-dev \
            libswscale-dev \
            libtool \
            libtool-bin \
            m4 \
            pkg-config \
            python3-dev \
            zlib1g-dev

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.33" \
            "virtualenv<21"

      - name: Build APK
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          rm -rf .buildozer bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blade-of-darkness-apk
          path: bin/*.apk
          if-no-files-found: error
