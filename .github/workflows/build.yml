name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            ccache \
            cmake \
            gettext \
            git \
            libffi-dev \
            libltdl-dev \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libtool \
            libtool-bin \
            m4 \
            pkg-config \
            python3-dev \
            unzip \
            wget \
            zip \
            zlib1g-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.33" \
            "virtualenv<21"

      - name: Build debug APK
        env:
          ACLOCAL_PATH: /usr/share/aclocal
        run: |
          rm -rf .buildozer bin
          buildozer android clean
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blade-of-darkness-apk
          path: bin/*.apk
          if-no-files-found: error
